[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "control-bench"
version = "0.1.0"
description = "Instruction-following and tool-use experiments with their shared steering runtime."
requires-python = ">=3.10"
license = "MIT"
license-files = ["if-tool-use-core/LICENSE"]
dependencies = [
    "torch>=2.4",
    "transformers>=5",
    "accelerate>=1.1",
    "huggingface-hub>=1.5",
    "safetensors>=0.5",
    "numpy>=1.17",
    "pysbd>=0.3.4",
    "repsteer==0.2.4",
]

[project.optional-dependencies]
tool-use = ["bfcl-eval==2026.3.23"]
test = ["pytest>=9"]

[project.urls]
Repository = "https://github.com/MingyuJ666/ControlBench"

[project.scripts]
cbench-run = "control_bench.cli.run:main"
cbench-campaign = "control_bench.cli.campaign:main"
cbench-selfcheck = "control_bench.cli.selfcheck:main"

[tool.setuptools]
packages = [
    "control_bench", "control_bench.cli", "control_bench.runtime",
    "control_bench.methods", "control_bench.domains",
    "control_bench.domains.instruction_following",
    "control_bench.domains.tool_use", "control_bench.domains.tool_use.single_turn",
    "control_bench.domains.tool_use.multi_turn", "control_bench.domains.tool_use_multi_turn",
]

[tool.setuptools.package-dir]
control_bench = "if-tool-use-core/control_bench"
"control_bench.domains.instruction_following" = "instruction-following/src/instruction_following"
"control_bench.domains.tool_use" = "tool-use/src/tool_use"
"control_bench.domains.tool_use_multi_turn" = "tool-use/src/tool_use_multi_turn"

[tool.setuptools.package-data]
"control_bench.domains.tool_use.multi_turn" = ["judge_turns.json"]

[tool.pytest.ini_options]
testpaths = ["if-tool-use-core/tests"]
