[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repsteer"
description = "Representation engineering and activation steering toolkit for (vision) language models"
version = "0.2.4"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "safetensors>=0.5",
    "torch",
    "transformers>=5",
]

[project.optional-dependencies]
sae = [
    "sae-lens",
]
vlm = [
    "pillow>=10",
]
dev = [
    "repsteer[sae,vlm]",
    "accelerate>=0.30",
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=7.4",
    "pytest-cov>=7.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "gpu: tests that require a CUDA environment",
]

[tool.coverage.run]
branch = true
source = ["repsteer"]

[tool.coverage.report]
fail_under = 70
show_missing = true
