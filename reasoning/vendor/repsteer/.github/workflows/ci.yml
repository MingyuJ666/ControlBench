name: CPU CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files
        env:
          SKIP: pytest
      - run: pytest -m "not gpu" --cov=repsteer --cov-branch --cov-report=term-missing
      - name: Enforce core-module coverage floors
        run: |
          coverage report --include='src/repsteer/runtime/*' --fail-under=75
          coverage report --include='src/repsteer/capture/*' --fail-under=75
          coverage report --include='src/repsteer/positions/*' --fail-under=80
